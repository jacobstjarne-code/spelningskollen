# Render Blueprint — Spelningskollen
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: spelningskollen
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m collector.api
    envVars:
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: SONGKICK_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: COLLECT_KEY
        generateValue: true
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.11.0
